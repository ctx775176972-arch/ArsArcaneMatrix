modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="ars_arcane_matrix.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="ars_arcane_matrix.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ars_nouveau"
type="required"
versionRange="[5.12.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="arsnumerichud"
type="optional"
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.21.1,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[15.10.5,)"
ordering="AFTER"
side="BOTH"
